name: Demo

# Publishes the interactive demo (docs/demo/) to GitHub Pages at
# https://avinashp7509.github.io/archi-made-easy/demo/ . Only the demo is published: the
# website (website/) stays off until its own follow-up (docs/program/release/LAUNCH.md), and
# when it is turned on, its build must carry demo/ as well, because Pages holds one site.
on:
  push:
    branches: [main]
    paths:
      - 'docs/demo/**'
      - 'scripts/demo/**'
      - 'scripts/build-demo.mjs'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: The published demo is what its sources build, and still one checked diagram
        run: |
          node scripts/build-demo.mjs --check
          node archi-made-easy/scripts/check-render-output.mjs docs/demo/index.html > /dev/null
      - name: Stage the site
        run: |
          mkdir -p _site/demo
          cp docs/demo/index.html docs/demo/checkout.architecture.json docs/demo/preview.png _site/demo/
          cp scripts/demo/site-index.html _site/index.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}demo/
    steps:
      - name: Deploy the demo
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
