name: Request a feature
description: Suggest a new capability or a change to an existing one, in a few lines.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check the [roadmap](https://github.com/Avinashp7509/archi-made-easy/blob/main/ROADMAP.md) first: the gaps listed there are already tracked, and a comment on why one matters to you is welcome. For a substantial change you would like to implement yourself, use the larger-change proposal instead. Never report a security vulnerability here; follow [SECURITY.md](https://github.com/Avinashp7509/archi-made-easy/blob/main/SECURITY.md).

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Who runs into it, and when? A concrete request you gave your agent, or the page or mode where you hit the limit, helps.
    validations:
      required: true

  - type: textarea
    id: proposed_behaviour
    attributes:
      label: Proposed behaviour
      description: What should happen instead? Describe the result you want, not necessarily how to build it.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you tried, including existing commands, workbench modes or exports.
    validations:
      required: false

  - type: input
    id: archi_made_easy_version
    attributes:
      label: Archi-Made-Easy version or commit
      placeholder: "1.0.0 or 0123456789abcdef..."
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Agent and its version
      description: The coding agent or client you used Archi-Made-Easy with, and its version.
      placeholder: "Claude Code 2.1.219"
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Safe to share
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: I removed access tokens, credentials, private repository contents, and personal or customer data.
          required: true
