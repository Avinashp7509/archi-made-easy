name: Report a reproducible bug
description: Report a problem with a command, a generated page or its workbench, an export, the validator, or installation.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Stability comes first. For diagram defects, include a small JSON reproduction (the architecture document your agent wrote) and the validation receipt when available. For installation or page problems, provide the relevant steps and error; explain when a command, JSON, or receipt does not apply.

        Workbench figures (availability, latency, capacity, cost) are modelled from the declared design, not measured; a difference from a real system is not a bug by itself, but a figure that contradicts its own inputs is. Never report a security vulnerability here; follow [SECURITY.md](https://github.com/Avinashp7509/archi-made-easy/blob/main/SECURITY.md).

  - type: input
    id: archi_made_easy_version
    attributes:
      label: Archi-Made-Easy version or commit
      placeholder: "1.0.0 or 0123456789abcdef..."
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: Installation method
      options:
        - Skills CLI (npx skills add)
        - Bundled installer from archi-made-easy.zip (install.mjs)
        - Source checkout (git clone)
        - Manual copy of the skill folder
        - Other
    validations:
      required: true

  - type: dropdown
    id: diagram_type
    attributes:
      label: Diagram type or area
      options:
        - Architecture
        - Workflow
        - Sequence
        - Data flow
        - Lifecycle
        - ERD
        - Class
        - Tree
        - Timeline
        - Waterfall
        - Explainer
        - Workbench (Explore, Review, Simulate, Security, Performance, FinOps, Optimize, Decide, Handoff)
        - Review or simulate command
        - Export (Mermaid, draw.io, Structurizr, design document)
        - Installation or packaging
        - Generated viewer
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Exact command
      description: Include flags and paths, replacing private path segments with neutral placeholders. If your agent ran the commands, copy them from its reply or transcript. For a problem seen in the page, describe the actions instead.
      render: shell
    validations:
      required: true

  - type: textarea
    id: minimal_json
    attributes:
      label: Minimal redacted JSON reproduction
      description: The document passed to `finalize` (or another command), with unrelated components and facts removed while preserving the failure. If JSON does not apply or cannot be produced, explain why and provide reproduction steps.
      render: json
    validations:
      required: true

  - type: textarea
    id: validation_receipt
    attributes:
      label: Validation receipt or exact error
      description: Prefer the complete JSON produced by `finalize --json`, `validate --json` or `deliver --json`. If no receipt or error exists, say so and describe the observed failure.
      render: json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: upload
    id: visual_evidence
    attributes:
      label: Supporting visual evidence
      description: When it helps reviewers evaluate a visual problem, upload screenshots or recordings and mark subtle defects. Reproducible steps above may be enough when media would not add useful context.
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, Node.js version, browser, agent or coding client and its version, and model when relevant.
      placeholder: "Windows 11, Node.js 24, Chrome, Claude Code 2.1.219, model-name"
    validations:
      required: true

  - type: checkboxes
    id: sensitive_data
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed access tokens, credentials, private repository contents, and personal or customer data.
          required: true
