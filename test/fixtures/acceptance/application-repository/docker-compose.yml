services:
  api:
    build: ./services/api
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://parcelpoint:parcelpoint@postgres:5432/parcelpoint
      REDIS_URL: redis://redis:6379
      AMQP_URL: amqp://rabbitmq:5672
      JWT_ISSUER: https://auth.parcelpoint.example
    depends_on: [postgres, redis, rabbitmq]

  worker:
    build: ./services/worker
    environment:
      DATABASE_URL: postgres://parcelpoint:parcelpoint@postgres:5432/parcelpoint
      AMQP_URL: amqp://rabbitmq:5672
      CARRIER_API_URL: https://api.carrier.example/v2
    depends_on: [postgres, rabbitmq]

  notifier:
    build: ./services/notifier
    environment:
      AMQP_URL: amqp://rabbitmq:5672
      MAIL_API_URL: https://api.mailer.example/v1
    depends_on: [rabbitmq]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: parcelpoint
      POSTGRES_PASSWORD: parcelpoint
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7

  rabbitmq:
    image: rabbitmq:3-management

volumes:
  pgdata: {}
